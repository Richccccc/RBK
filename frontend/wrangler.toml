# Cloudflare Workers（静态资源模式）部署配置 —— 仅用「Workers」方式部署前端时生效
# 若用 Cloudflare Pages 部署，Pages 会自动忽略本文件，不影响构建
# 注意：name 必须和 Cloudflare 上 Worker 的名字一致，否则会部署到新 Worker 上
name = "hcmblog"
compatibility_date = "2026-09-03"

[assets]
directory = "./dist"
# SPA 单页应用回退：刷新 /post/1 这类路由时返回 index.html，不会 404
not_found_handling = "single-page-application"
