# 每 5 分钟（GitHub Actions 最小间隔）访问一次后端健康检查，降低 Vercel serverless 冷启动概率
name: keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          curl -fsS -o /dev/null "${{ secrets.BACKEND_URL }}/api/health" && echo "OK" || echo "PING_FAILED"
