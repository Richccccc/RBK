# Render Blueprint：仅部署后端（前端用 Cloudflare Pages）
services:
  - type: web
    name: myblog-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false